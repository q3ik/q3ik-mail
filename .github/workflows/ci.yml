name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker typecheck
      - run: pnpm --filter @q3ik-mail/web typecheck
      - run: pnpm --filter @q3ik-mail/database typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker lint
      - run: pnpm --filter @q3ik-mail/web lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker test
      - run: pnpm --filter @q3ik-mail/database test
      - run: pnpm --filter @q3ik-mail/web test

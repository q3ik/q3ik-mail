name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker typecheck
      - run: pnpm --filter @q3ik-mail/web typecheck
      - run: pnpm --filter @q3ik-mail/database typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker lint
      - run: pnpm --filter @q3ik-mail/web lint

  unit-test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker test
      - run: pnpm --filter @q3ik-mail/database test
      - run: pnpm --filter @q3ik-mail/web test
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/test-results/junit.xml'
          retention-days: 14
      - name: Publish test annotations
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/test-results/junit.xml'
          check_name: Unit Test Results

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Build Next.js app (required before wrangler pages dev)
      - name: Build web app
        run: pnpm --filter @q3ik-mail/web build

      # Seed local D1 with schema and fixture data
      - name: Initialize local D1 schema
        run: npx wrangler d1 execute q3ik-mail-db --local --file=../../packages/database/schema.sql
        working-directory: apps/web
      - name: Seed E2E fixtures
        run: npx wrangler d1 execute q3ik-mail-db --local --file=../../packages/database/fixtures.sql
        working-directory: apps/web

      # Install only Chromium (faster than full Playwright install)
      - name: Install Playwright Chromium
        run: pnpm --filter @q3ik-mail/web exec playwright install chromium --with-deps

      # Start local server in background, wait for it
      - name: Start wrangler pages dev
        run: |
          pnpm --filter @q3ik-mail/web exec wrangler pages dev .next --port 3000 &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright E2E
        run: pnpm --filter @q3ik-mail/web e2e
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Comment E2E results on PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: `## 🎭 Playwright E2E Report\n[View full report and artifacts](${runUrl}#artifacts)`
            });

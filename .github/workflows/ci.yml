name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch: # manual trigger
    inputs:
      run:
        description: What should this manual run execute?
        type: choice
        required: true
        default: all
        options:
          - all
          - mail-delivery

permissions:
  contents: read

# Cancel any in-progress run for the same branch/PR the moment a newer commit
# is pushed. This prevents redundant runs from queuing up and wasting runner
# minutes — only the latest commit on a given ref ever runs to completion.
#
# Group key breakdown:
#   - github.workflow  : isolates this workflow from any future ones added
#   - github.ref       : one slot per branch (e.g. refs/heads/trunk,
#                        refs/pull/61/merge) so parallel PRs never cancel
#                        each other
#
# cancel-in-progress: true  — kill the running workflow immediately rather
# than waiting for it to finish before starting the replacement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # For pull_request events, skip test pipeline jobs when the PR carries
  # the `skip-tests` label. Push runs and full workflow_dispatch runs are
  # unaffected.
  # This avoids re-running tests on every PR update while the label is present.
  #
  # For workflow_dispatch with `run: mail-delivery`, skip the normal pipeline
  # and run only the E2E Mail Delivery Tests job. This lets fixes to that
  # trunk-only test be verified from any branch.
  #
  # Reusable expression:
  #   - true for non-PR events
  #   - true for PRs without `skip-tests`
  #   - false for PRs with `skip-tests`
  #
  # NOTE: Keep this in sync across all test-pipeline jobs.
  #
  #   github.event_name != 'pull_request' ||
  #   !contains(github.event.pull_request.labels.*.name, 'skip-tests')
  config-guard:
    name: Config Validation
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.run != 'mail-delivery') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-tests'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check wrangler.toml database_id placeholder
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          # Fail fast and explicitly if the secret is missing or empty.
          # This distinguishes "secret not configured" from any other failure mode.
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "ERROR: CLOUDFLARE_D1_DATABASE_ID secret is empty or not set."
            echo "Configure it in: repo Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Substitute the real database_id from the repo secret before checking.
          # Use | as the sed delimiter — safe for UUIDs which never contain |.
          # The placeholder must never be hardcoded in source; the secret is the
          # single source of truth for the real D1 ID.
          sed -i "s|REPLACE_WITH_YOUR_DATABASE_ID|${D1_DATABASE_ID}|" apps/worker/wrangler.toml

          if grep -q "REPLACE_WITH_YOUR_DATABASE_ID" apps/worker/wrangler.toml; then
            echo "ERROR: database_id placeholder not replaced in apps/worker/wrangler.toml"
            echo "Ensure the CLOUDFLARE_D1_DATABASE_ID secret is set in repo Settings → Secrets."
            exit 1
          fi

  typecheck:
    name: TypeScript
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.run != 'mail-delivery') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-tests'))
    runs-on: ubuntu-latest
    needs: config-guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker typecheck
      - run: pnpm --filter web typecheck
      - run: pnpm --filter @q3ik-mail/database typecheck

  lint:
    name: Lint
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.run != 'mail-delivery') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-tests'))
    runs-on: ubuntu-latest
    needs: config-guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker lint
      - run: pnpm --filter web lint

  migration-validation:
    name: Migration Validation
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.run != 'mail-delivery') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-tests'))
    runs-on: ubuntu-latest
    needs: config-guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}

      - name: Apply migrations on a clean local D1 database
        run: >
          npx wrangler d1 migrations apply q3ik-mail-db
          --local
          --persist-to $GITHUB_WORKSPACE/.wrangler/migration-clean
        working-directory: apps/worker

      - name: Assert schema after clean apply
        run: |
          npx wrangler d1 execute q3ik-mail-db \
            --local \
            --persist-to $GITHUB_WORKSPACE/.wrangler/migration-clean \
            --command "PRAGMA table_info(emails);" \
            --json > /tmp/emails_schema.json
          npx wrangler d1 execute q3ik-mail-db \
            --local \
            --persist-to $GITHUB_WORKSPACE/.wrangler/migration-clean \
            --command "PRAGMA index_list(emails);" \
            --json > /tmp/emails_indexes.json
          npx wrangler d1 execute q3ik-mail-db \
            --local \
            --persist-to $GITHUB_WORKSPACE/.wrangler/migration-clean \
            --command "PRAGMA table_info(attachments);" \
            --json > /tmp/attachments_schema.json
          jq -e '.[0].results | any(.name == "body_text_key") and any(.name == "body_html_key")' /tmp/emails_schema.json >/dev/null
          jq -e '.[0].results | any(.name == "idx_emails_thread_list")' /tmp/emails_indexes.json >/dev/null
          jq -e '.[0].results | all(.name != "idx_emails_thread_id")' /tmp/emails_indexes.json >/dev/null
          jq -e '.[0].results | any(.name == "email_id") and any(.name == "r2_key")' /tmp/attachments_schema.json >/dev/null
        working-directory: apps/worker

      - name: Apply migrations on a pre-seeded local D1 database
        run: |
          npx wrangler d1 migrations apply q3ik-mail-db \
            --local \
            --persist-to $GITHUB_WORKSPACE/.wrangler/migration-preseeded
          npx wrangler d1 migrations apply q3ik-mail-db \
            --local \
            --persist-to $GITHUB_WORKSPACE/.wrangler/migration-preseeded
        working-directory: apps/worker

      - name: Assert schema after pre-seeded re-apply
        run: |
          npx wrangler d1 execute q3ik-mail-db \
            --local \
            --persist-to $GITHUB_WORKSPACE/.wrangler/migration-preseeded \
            --command "PRAGMA table_info(emails);" \
            --json > /tmp/emails_preseeded_schema.json
          npx wrangler d1 execute q3ik-mail-db \
            --local \
            --persist-to $GITHUB_WORKSPACE/.wrangler/migration-preseeded \
            --command "PRAGMA index_list(emails);" \
            --json > /tmp/emails_preseeded_indexes.json
          npx wrangler d1 execute q3ik-mail-db \
            --local \
            --persist-to $GITHUB_WORKSPACE/.wrangler/migration-preseeded \
            --command "PRAGMA table_info(attachments);" \
            --json > /tmp/attachments_preseeded_schema.json
          jq -e '.[0].results | any(.name == "body_text_key") and any(.name == "body_html_key")' /tmp/emails_preseeded_schema.json >/dev/null
          jq -e '.[0].results | any(.name == "idx_emails_thread_list")' /tmp/emails_preseeded_indexes.json >/dev/null
          jq -e '.[0].results | all(.name != "idx_emails_thread_id")' /tmp/emails_preseeded_indexes.json >/dev/null
          jq -e '.[0].results | any(.name == "email_id") and any(.name == "r2_key")' /tmp/attachments_preseeded_schema.json >/dev/null
        working-directory: apps/worker

  unit-test:
    name: Unit & Integration Tests
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.run != 'mail-delivery') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-tests'))
    runs-on: ubuntu-latest
    needs: [typecheck, lint, migration-validation]
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}
      - run: pnpm --filter @q3ik-mail/worker test
      - run: pnpm --filter @q3ik-mail/database test
      - run: pnpm --filter web test
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: '**/test-results/junit.xml'
          retention-days: 14
      - name: Publish test annotations
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/test-results/junit.xml'
          check_name: Unit Test Results

  e2e:
    name: E2E Tests
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.run != 'mail-delivery') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-tests'))
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}

      # Inject the real D1 database_id from the repo secret into both
      # wrangler.toml files so local D1 paths are consistent across apps.
      - name: Inject D1 database_id
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID secret is empty or not set."
            exit 1
          fi
          sed -i "s|REPLACE_WITH_YOUR_DATABASE_ID|${D1_DATABASE_ID}|" apps/worker/wrangler.toml apps/web/wrangler.toml
          echo "✓ database_id injected into apps/worker and apps/web wrangler.toml"
          
      # Build for Cloudflare Workers via OpenNext — outputs to .open-next/
      - name: Build web app
        run: pnpm --filter web run build:cf
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          
      # Apply all numbered migrations against the local D1 instance.
      # Uses the canonical migration workflow (000_init.sql, 001_*, …) rather
      # than the legacy schema.sql one-shot, so CI matches the production
      # deployment path exactly.
      - name: Apply D1 migrations (local)
        run: >
          npx wrangler d1 migrations apply q3ik-mail-db
          --local
          --persist-to $GITHUB_WORKSPACE/.wrangler/state
        working-directory: apps/worker

      - name: Seed E2E fixtures
        run: >
          npx wrangler d1 execute q3ik-mail-db
          --local
          --persist-to $GITHUB_WORKSPACE/.wrangler/state
          --file=../../packages/database/fixtures.sql
        working-directory: apps/web

      # Install only Chromium (faster than full Playwright install)
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      # Provide dev secrets for wrangler dev (Playwright's webServer).
      # .dev.vars is git-ignored; wrangler reads it automatically.
      - name: Create .dev.vars for E2E
        run: echo 'THREAD_LIST_CURSOR_SECRET=e2e-cursor-secret' > apps/web/.dev.vars

      # Playwright's webServer block (playwright.config.ts) starts wrangler
      # pages dev and waits for a real HTTP 200 before running any test.
      # No manual background server or wait-on needed here.
      - name: Run Playwright E2E
        run: pnpm --filter web e2e
        env:
          BASE_URL: http://localhost:3000
          CI: true
          # Tell playwright.config.ts where the seeded miniflare state lives
          # so the --persist-to path resolves correctly from apps/web/.
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Comment E2E results on PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              owner, repo,
              issue_number: context.issue.number,
              body: `## 🎭 Playwright E2E Report\n[View full report and artifacts](${runUrl}#artifacts)`
            });

  e2e-mail-tests:
    name: E2E Mail Delivery Tests
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/trunk'))
    runs-on: ubuntu-latest
    needs: unit-test
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ github.event_name == 'push' }}

      # Inject the real D1 database_id from the repo secret into both
      # wrangler.toml files so local D1 paths are consistent across apps.
      - name: Inject D1 database_id
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID secret is empty or not set."
            exit 1
          fi
          sed -i "s|REPLACE_WITH_YOUR_DATABASE_ID|${D1_DATABASE_ID}|" apps/worker/wrangler.toml apps/web/wrangler.toml
          echo "✓ database_id injected into apps/worker and apps/web wrangler.toml"
      
      - name: Build web app
        run: pnpm --filter web run build:cf
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          
      - name: Apply D1 migrations (local)
        run: >
          npx wrangler d1 migrations apply q3ik-mail-db
          --local
          --persist-to $GITHUB_WORKSPACE/.wrangler/state
        working-directory: apps/worker

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Create .dev.vars for E2E
        run: echo 'THREAD_LIST_CURSOR_SECRET=e2e-cursor-secret' > apps/web/.dev.vars

      # Issue 6 fix: start the app via wrangler pages dev (same as the
      # existing e2e job) and wait for it to be ready before running the
      # spec. Without this step every request.get('/api/...') in the
      # mail-delivery spec would fail with ERR_CONNECTION_REFUSED.
      - name: Start app (wrangler dev)
        run: >
          npx wrangler dev
          --port 3000
          --persist-to $GITHUB_WORKSPACE/.wrangler/state
          > $GITHUB_WORKSPACE/wrangler.log 2>&1
          &
        working-directory: apps/web

      - name: Wait for app to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 1; done'
     
      - name: Dump wrangler log on failure
        if: failure()
        run: cat $GITHUB_WORKSPACE/wrangler.log || echo 'No wrangler log found'

      # Playwright's webServer block (playwright.config.ts) starts wrangler
      # pages dev and waits for HTTP 200 before running any test — same as
      # the regular e2e job.  No manual server start or wait-on needed.
      - name: Run agentmail.to E2E
        run: pnpm --filter web exec playwright test e2e/mail-delivery.spec.ts
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
          # RESEND_API_KEY is intentionally omitted — Scenario A now routes
          # through /api/trigger-inbound; the key never touches PW traces.
          E2E_INBOUND_FROM: ${{ secrets.E2E_INBOUND_FROM }}
          E2E_INBOUND_ADDRESS: ${{ secrets.E2E_INBOUND_ADDRESS }}
          BASE_URL: http://localhost:3000
          CI: true
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload mail E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-e2e-report
          path: apps/web/playwright-report/
          retention-days: 14

  # ─── Deploy ────────────────────────────────────────────────────────────
  # Deploys the Cloudflare Worker after all tests pass.
  # Only runs on pushes to trunk (i.e. merged PRs) and full manual triggers.
  #
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   CLOUDFLARE_API_TOKEN    – API Token with Workers Scripts:Edit and D1:Edit
  #                              permissions (or use separate tokens for deploy
  #                              and remote D1 migrations)
  #   CLOUDFLARE_ACCOUNT_ID   – Cloudflare account ID
  #   CLOUDFLARE_D1_DATABASE_ID – D1 database UUID (already configured)
  deploy-worker:
    name: Deploy Worker
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/trunk' ||
      (github.event_name == 'workflow_dispatch' && inputs.run == 'all')
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Inject D1 database ID
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID secret is not set"
            exit 1
          fi
          sed -i "s|REPLACE_WITH_YOUR_DATABASE_ID|${D1_DATABASE_ID}|" apps/worker/wrangler.toml
          # Verify replacement succeeded
          if grep -q "REPLACE_WITH_YOUR_DATABASE_ID" apps/worker/wrangler.toml; then
            echo "::error::Failed to replace database_id placeholder"
            exit 1
          fi
          echo "✓ database_id injected"

      - name: Deploy worker
        run: npx wrangler deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ─── Deploy Web ────────────────────────────────────────────────────────
  # Deploys the Next.js web app to Cloudflare Workers (via @opennextjs/cloudflare).
  # Runs after E2E tests pass, in parallel with deploy-worker.
  #
  # Uses `wrangler deploy` (Worker with Assets) — NOT Pages.
  # The app will be available at q3ik-mail.jayakubik.workers.dev.
  deploy-web:
    name: Deploy Web
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/trunk' ||
      (github.event_name == 'workflow_dispatch' && inputs.run == 'all')
    runs-on: ubuntu-latest
    needs: [e2e]
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Inject D1 database ID
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID secret is not set"
            exit 1
          fi
          sed -i "s|REPLACE_WITH_YOUR_DATABASE_ID|${D1_DATABASE_ID}|" apps/web/wrangler.toml
          if grep -q "REPLACE_WITH_YOUR_DATABASE_ID" apps/web/wrangler.toml; then
            echo "::error::Failed to replace database_id placeholder"
            exit 1
          fi
          echo "✓ database_id injected into apps/web/wrangler.toml"

      - name: Build web app
        run: pnpm --filter web run build:cf
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          
      - name: Deploy web app
        run: npx wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

#:schema node_modules/wrangler/config-schema.json
name = "q3ik-mail-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "q3ik-mail-db"
database_id = "a184446c-a11e-4b15-89c0-8b099304ab08"

[vars]
ENVIRONMENT = "production"
# RESEND_API_KEY and RESEND_WEBHOOK_SECRET are set via wrangler secret put
# SENTRY_DSN is set via wrangler secret put

#:schema node_modules/wrangler/config-schema.json
name = "q3ik-mail-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cron Trigger: re-thread orphaned emails every 5 minutes.
# Replaces the former /api/rethread HTTP endpoint (issue #31).
# To test locally: npx wrangler dev --test-scheduled
[triggers]
crons = ["*/5 * * * *"]

# The D1 database binding
# Run `npx wrangler d1 create q3ik-mail-db` and replace the placeholder below
[[d1_databases]]
binding = "DB"
database_name = "q3ik-mail-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
migrations_dir = "../../packages/database/migrations"

[vars]
ENVIRONMENT = "production"
# RESEND_API_KEY, RESEND_WEBHOOK_SECRET, and SENTRY_DSN are set via wrangler secret put

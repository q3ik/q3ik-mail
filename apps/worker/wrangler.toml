#:schema node_modules/wrangler/config-schema.json
name = "q3ik-mail-worker"
main = "src/index.ts"
compatibility_date = "2026-04-21"
compatibility_flags = ["nodejs_compat"]

# Cron Trigger: re-thread orphaned emails every 5 minutes.
# Replaces the former /api/rethread HTTP endpoint (issue #31).
# To test locally: npx wrangler dev --test-scheduled
#[triggers]
#crons = ["*/5 * * * *"]

# The D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "q3ik-mail-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
migrations_dir = "../../packages/database/migrations"
# ^ Path is relative to this wrangler.toml (apps/worker/).
#   Always run `wrangler d1 migrations apply` from the apps/worker/ directory.

[[r2_buckets]]
binding = "EMAIL_BODIES"
bucket_name = "q3ik-mail-bodies"

[[unsafe.bindings]]
name = "WEBHOOK_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1"
simple = { limit = 60, period = 60 }

[observability]
enabled = true

[observability.traces]
enabled = true
# Destination name must match the one configured in the CF dashboard
# (Workers & Pages > Observability > Destinations)
destinations = ["sentry-traces"]

[observability.logs]
enabled = true
invocation_logs = true
# Destination name must match the one configured in the CF dashboard
destinations = ["sentry-logs"]

[vars]
ENVIRONMENT = "production"
# The following secrets must be set via `wrangler secret put <NAME>`:
#   RESEND_API_KEY            - Resend API key for sending email
#   RESEND_WEBHOOK_SECRET     - Resend webhook signing secret
#   CLOUDFLARE_ACCESS_AUD     - AUD tag from the Cloudflare Access application
#   CLOUDFLARE_TEAM_DOMAIN    - Zero Trust team domain, e.g. "yourteam.cloudflareaccess.com"
#   SENTRY_DSN                - (optional) Sentry DSN for error reporting

#:schema node_modules/wrangler/config-schema.json
name = "q3ik-mail"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-09-23"
pages_build_output_dir = ".vercel/output/static"

# D1 database binding
# Run `npx wrangler d1 create q3ik-mail-db` and replace the placeholder below
[[d1_databases]]
binding = "DB"
database_name = "q3ik-mail-db"
database_id = "${CLOUDFLARE_D1_DATABASE_ID}"

[[r2_buckets]]
binding = "EMAIL_BODIES"
bucket_name = "q3ik-mail-bodies"

[vars]
# RESEND_API_KEY is set via: wrangler secret put RESEND_API_KEY

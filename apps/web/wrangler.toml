#:schema node_modules/wrangler/config-schema.json
name = "q3ik-mail"
main = ".open-next/worker.js"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-08-16"

# Static assets produced by @opennextjs/cloudflare
# The binding name MUST be "ASSETS" for the cache to work.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "q3ik-mail-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[[r2_buckets]]
binding = "EMAIL_BODIES"
bucket_name = "q3ik-mail-bodies"

[vars]
# Runtime secrets are set via `wrangler secret put <NAME>`:
#   RESEND_API_KEY
#   THREAD_LIST_CURSOR_SECRET
#   CLOUDFLARE_ACCESS_AUD
#   CLOUDFLARE_TEAM_DOMAIN
#   SENTRY_DSN
#
# For local dev, copy .dev.vars.example to .dev.vars and fill in values.

#:schema node_modules/wrangler/config-schema.json
name = "q3ik-mail"
main = ".open-next/worker.js"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2025-08-16"

# Static assets produced by @opennextjs/cloudflare
# The binding name MUST be "ASSETS" for the cache to work.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "q3ik-mail-db"
database_id = "6c52332d-12dc-41ec-9ff2-0e377c697188"

[[r2_buckets]]
binding = "EMAIL_BODIES"
bucket_name = "q3ik-mail-bodies"

[vars]
# RESEND_API_KEY is set via: wrangler secret put RESEND_API_KEY

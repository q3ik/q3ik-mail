#:schema node_modules/wrangler/config-schema.json
name = "q3ik-mail-web"
compatibility_date = "2024-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 database binding — must match database_id in apps/worker/wrangler.toml
[[d1_databases]]
binding = "DB"
database_name = "q3-inbox-db"
database_id = "your-d1-id-here"  # replace with output from: wrangler d1 create q3-inbox-db

[vars]
# RESEND_API_KEY is set via: wrangler secret put RESEND_API_KEY
